schema = 1
id = "signal.risk_parity"
kind = "signal"
title = "Risk Parity Allocation"
description = "Risk parity allocation weighting inversely proportional to volatility"
tags = ["statistical", "volatility"]
pitfalls = [
  "Assumes stable volatility relationships",
  "May underperform in momentum-driven markets",
  "See [avoiding backtest biases](https://honba-labs.github.io/honba/book/backtesting/avoiding_backtest_biases.html) for general pitfalls."
]

[params.lookback_window]
type = "int"
default = 60
min = 20
max = 252
step = 10
description = "Lookback window for volatility estimation"
sweepable = true

[params.rebalance_frequency]
type = "enum"
choices = ["weekly", "monthly", "quarterly"]
default = "monthly"
description = "Rebalancing frequency"
sweepable = false

[params.min_volatility]
type = "float"
default = 0.0001
min = 0.00001
max = 0.01
description = "Minimum volatility floor"
sweepable = false

[params.max_leverage]
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.1
description = "Maximum leverage"
sweepable = false

[params.freeze_limit]
type = "int"
default = 1800
min = 1
max = 100000
step = 1
description = "SEBI single-order freeze limit"
sweepable = false

[params.max_allocation]
type = "float"
default = 1.0
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed (max)"
sweepable = false

[params.capital]
type = "float"
default = 10000000
min = 1000
max = 100000000000
description = "INR available to the strategy"
sweepable = false

[requires]
bars = ["close"]
fundamentals = []
indicators = []
history_bars = 60
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity", "price"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]
