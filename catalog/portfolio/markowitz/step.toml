schema = 1
id = "signal.markowitz"
kind = "signal"
title = "Markowitz Mean-Variance Optimizer"
version = "1.0.0"
strategy_api_version = "1.0.0"
description = "Mean-variance optimization maximizing Sharpe ratio with constraints"
tags = ["statistical"]
pitfalls = [
  "Requires stable covariance estimates",
  "Sensitive to estimation error",
  "See [avoiding backtest biases](https://honba-labs.github.io/honba/book/backtesting/avoiding_backtest_biases.html) for general pitfalls."
]

[params.lookback_window]
type = "int"
default = 252
min = 60
max = 504
step = 12
description = "Lookback window for returns estimation"
sweepable = true

[params.rebalance_frequency]
type = "enum"
choices = ["weekly", "monthly", "quarterly"]
default = "monthly"
description = "Rebalancing frequency"
sweepable = false

[params.risk_free_rate]
type = "float"
default = 0.06
min = 0.0
max = 0.15
step = 0.01
description = "Risk free rate (annual)"
sweepable = false

[params.max_weight]
type = "float"
default = 0.20
min = 0.05
max = 0.50
step = 0.05
description = "Maximum weight per asset"
sweepable = true

[params.min_weight]
type = "float"
default = 0.00
min = 0.00
max = 0.10
step = 0.01
description = "Minimum weight per asset"
sweepable = true

[params.freeze_limit]
type = "int"
default = 1800
min = 1
max = 100000
step = 1
description = "SEBI single-order freeze limit"
sweepable = false

[params.max_allocation]
type = "float"
default = 1.0
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed (max)"
sweepable = false

[params.capital]
type = "float"
default = 10000000
min = 1000
max = 100000000000
description = "INR available to the strategy"
sweepable = false

[requires]
bars = ["close"]
fundamentals = []
indicators = []
history_bars = 252
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity", "price"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]
