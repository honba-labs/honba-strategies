schema = 1
id = "execute.pov"
kind = "execute"
title = "POV Execution"
version = "1.0.0"
strategy_api_version = "1.0.0"
description = "Percentage of Volume execution: participates at target rate of market volume, dynamically adjusting slice size based on real-time volume."
tags = ["execution", "slicing", "pov"]
pitfalls = [
  "Low liquidity can cause execution to stall indefinitely.",
  "High participation rate increases market impact risk.",
  "Volume spikes may cause oversized slices if not capped.",
]

[params.total_quantity]
type = "float"
default = 1000
min = 1
max = 1000000
step = 10
description = "Total parent order quantity to execute."
sweepable = true

[params.target_rate]
type = "float"
default = 0.05
min = 0.01
max = 0.3
step = 0.01
description = "Target participation rate (fraction of market volume)."
sweepable = true

[params.max_slice_size]
type = "float"
default = 200
min = 1
max = 100000
step = 1
description = "Maximum slice size (lots)."
sweepable = true

[params.min_slice_size]
type = "float"
default = 10
min = 1
max = 10000
step = 1
description = "Minimum slice size (lots)."
sweepable = true

[params.freeze_limit]
type = "int"
default = 1800
min = 1
max = 100000
step = 1
description = "SEBI single-order freeze limit (lots per order)."
sweepable = false

[params.volume_window]
type = "int"
default = 5
min = 1
max = 60
step = 1
description = "Rolling volume window in minutes for dynamic sizing."
sweepable = true

[params.capital]
type = "float"
default = 1000000
min = 1000
max = 10000000000
description = "INR available to the strategy."
sweepable = false

[params.max_allocation]
type = "float"
default = 1.0
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed (max)."
sweepable = false

[requires]
bars = ["close", "volume"]
fundamentals = []
indicators = []
history_bars = 0
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity", "price"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk"]
