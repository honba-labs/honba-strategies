schema = 1
id = "size.kelly_criterion"
kind = "size"
title = "Kelly Criterion Position Sizer"
version = "1.0.0"
strategy_api_version = "1.0.0"
description = "Optimal capital allocation fraction from win-rate and win/loss ratio with fractional Kelly damping"
tags = ["sizing", "kelly", "risk_management"]
pitfalls = [
  "Requires accurate win-rate/win-loss estimates",
  "Full Kelly is aggressive - use Half-Kelly or less",
  "Assumes stationary distribution - regime changes break it",
  "Correlation between strategies not accounted for",
]

[params]
win_rate = { type = "float", default = 0.55, min = 0.01, max = 0.99, step = 0.01, description = "Historical win probability (0 to 1)" }
win_loss_ratio = { type = "float", default = 1.5, min = 0.1, max = 10.0, step = 0.1, description = "Average win / average loss ratio" }
kelly_fraction = { type = "float", default = 0.5, min = 0.1, max = 1.0, step = 0.05, description = "Fraction of full Kelly (0.5 = Half-Kelly)" }
max_position_notional = { type = "float", default = 500000.0, min = 10000.0, max = 10000000.0, step = 10000.0, description = "Maximum position notional cap (INR)" }
max_risk_per_trade = { type = "float", default = 10000.0, min = 1000.0, max = 100000.0, step = 1000.0, description = "Maximum absolute risk per trade (INR)" }
lot_size = { type = "float", default = 1.0, min = 1.0, max = 100.0, step = 1.0, description = "Exchange lot size for discretization" }
freeze_limit = { type = "int", default = 1800, min = 1, max = 10000, step = 1, description = "Exchange single-order freeze limit (contracts)" }
fallback_stop_atr_mult = { type = "float", default = 2.0, min = 0.5, max = 5.0, step = 0.1, description = "ATR multiplier for fallback stop when signal lacks explicit stop" }
min_kelly_fraction = { type = "float", default = 0.0, min = 0.0, max = 0.5, step = 0.05, description = "Minimum allowed Kelly fraction floor" }
max_kelly_fraction = { type = "float", default = 1.0, min = 0.1, max = 2.0, step = 0.1, description = "Maximum allowed Kelly fraction cap" }

[requires]
bars = ["close", "ts"]
indicators = []
history_bars = 1

[consumes]
shape = "candidates"

[emits]
shape = "weights"
adds = ["quantity", "notional", "risk_amount"]
