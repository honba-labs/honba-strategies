schema = 1
id = "size.equal_risk"
kind = "size"
title = "Equal Risk Contribution Position Sizer"
version = "1.0.0"
strategy_api_version = "1.0.0"
description = "Allocates risk budget equally across active signals with optional correlation adjustment"
tags = ["sizing", "risk_parity", "risk_management"]
pitfalls = [
  "Requires all active signals for multi-signal ERC",
  "Correlation matrix must be provided externally",
  "Assumes stable correlations - regime changes break ERC",
  "Equal risk may underweight high-conviction signals",
]

[params]
total_risk_pct = { type = "float", default = 0.05, min = 0.01, max = 0.2, step = 0.01, description = "Total portfolio risk budget as fraction of equity" }
max_position_notional = { type = "float", default = 500000.0, min = 10000.0, max = 10000000.0, step = 10000.0, description = "Maximum individual position notional cap (INR)" }
lot_size = { type = "float", default = 1.0, min = 1.0, max = 100.0, step = 1.0, description = "Exchange lot size for discretization" }
freeze_limit = { type = "int", default = 1800, min = 1, max = 10000, step = 1, description = "Exchange single-order freeze limit (contracts)" }
fallback_stop_atr_mult = { type = "float", default = 2.0, min = 0.5, max = 5.0, step = 0.1, description = "ATR multiplier for fallback stop" }
use_correlation = { type = "bool", default = true, description = "Use correlation matrix for cross-asset risk adjustment" }
min_correlation = { type = "float", default = -0.5, min = -1.0, max = 0.9, step = 0.1, description = "Floor for correlation matrix elements" }
max_correlation = { type = "float", default = 0.9, min = -0.5, max = 1.0, step = 0.1, description = "Cap for correlation matrix elements" }

[requires]
bars = ["close", "ts"]
indicators = []
history_bars = 1

[consumes]
shape = "candidates"

[emits]
shape = "weights"
adds = ["quantity", "notional", "risk_amount"]
