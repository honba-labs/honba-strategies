schema = 1
id = "signal.turtle_20"
kind = "signal"
title = "Turtle Trading System"
description = "Richard Dennis Turtle Trading System - Donchian breakout with ATR position sizing and pyramiding"
tags = ["trend", "breakout", "donchian", "turtle"]
pitfalls = [
  "Whipsaws in sideways markets; Donchian channels generate false breakouts",
  "Pyramiding increases risk; max 4 units can accumulate significant exposure",
  "ATR-based stops can be wide in volatile markets; ensure adequate capital",
  "See [avoiding backtest biases](https://honba-labs.github.io/honba/book/backtesting/avoiding_backtest_biases.html) for general pitfalls."
]

[params.system]
type = "int"
default = 1
min = 1
max = 2
description = "System selection: 1 = 20-day, 2 = 55-day"
sweepable = true

[params.channel_period]
type = "int"
min = 5
max = 100
step = 5
description = "Donchian channel period (overridden by system)"
sweepable = true
optional = true

[params.exit_period]
type = "int"
min = 5
max = 50
step = 5
description = "Exit channel period (overridden by system)"
sweepable = true
optional = true

[params.atr_period]
type = "int"
default = 20
min = 5
max = 50
step = 1
description = "ATR period for volatility measurement"
sweepable = true

[params.atr_multiplier]
type = "float"
default = 2.0
min = 0.5
max = 5.0
step = 0.5
description = "ATR multiplier for N calculation"
sweepable = true

[params.pyramid_threshold]
type = "float"
default = 0.5
min = 0.1
max = 2.0
step = 0.1
description = "Profit threshold for pyramiding (multiples of N)"
sweepable = true

[params.max_units]
type = "int"
default = 4
min = 1
max = 10
step = 1
description = "Maximum pyramid units"
sweepable = true

[params.risk_per_trade_pct]
type = "float"
default = 0.02
min = 0.005
max = 0.05
step = 0.005
description = "Risk per trade as fraction of capital"
sweepable = true

[params.freeze_limit]
type = "int"
default = 1800
min = 1
max = 100000
step = 1
description = "SEBI single-order freeze limit"
sweepable = false

[params.max_position_pct]
type = "float"
default = 0.10
min = 0.01
max = 0.2
step = 0.01
description = "Maximum position as fraction of capital"
sweepable = false

[params.max_allocation]
type = "float"
default = 1.0
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed (max)"
sweepable = false

[params.capital]
type = "float"
default = 1000000
min = 1000
max = 10000000000
description = "INR available to the strategy"
sweepable = false

[requires]
bars = ["high", "low", "close"]
fundamentals = []
indicators = []
history_bars = 55
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity", "price"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]