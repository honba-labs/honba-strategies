schema = 1
id = "signal.calendar_spread"
kind = "signal"
title = "Calendar Spread"
description = "Time-decay term structure calendar spread: long far-term option, short near-term option at same strike"
tags = ["volatility", "calendar", "theta"]
pitfalls = [
  "Requires positive theta - check term structure",
  "Vega risk: long far-term loses if IV drops",
  "Gamma risk near expiry - manage actively",
  "Wide bid-ask on far-term increases cost",
]

[params]
strike_selection = { type = "enum", default = "atm", choices = ["atm", "otm_call", "otm_put"], description = "Strike selection: atm, otm_call, otm_put" }
near_expiry_days = { type = "int", default = 7, min = 3, max = 30, step = 1, description = "Days to near-term expiry" }
far_expiry_days = { type = "int", default = 35, min = 21, max = 60, step = 7, description = "Days to far-term expiry" }
profit_target_pct = { type = "float", default = 0.25, min = 0.1, max = 0.5, step = 0.05, description = "Profit target as % of max profit (25%)" }
stop_loss_pct = { type = "float", default = 0.50, min = 0.2, max = 1.0, step = 0.1, description = "Stop-loss as % of debit paid (50%)" }
lots = { type = "int", default = 1, min = 1, max = 10, step = 1, description = "Number of lots" }
freeze_limit = { type = "int", default = 1800, min = 1, max = 10000, step = 1, description = "Exchange freeze limit" }

[requires]
bars = ["close", "ts"]
indicators = []
history_bars = 1

[consumes]
shape = "universe"

[emits]
shape = "candidates"
adds = ["direction", "entry_price", "stop_loss", "volatility_atr"]