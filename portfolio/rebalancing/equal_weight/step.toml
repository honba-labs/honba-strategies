schema = 1
id = "size.equal_weight"
kind = "size"
title = "Equal-weight rebalance"
description = "Every schedule, re-read the universe, drop leavers, add joiners and return each member to 1/N."
tags = ["portfolio", "rebalance", "equal_weight"]

# Takes the whole universe and does selection, weighting and scheduling itself, so today it consumes
# 'universe' and emits orders directly. A future split into select/weight steps would consume 'candidates'.
# history_bars 64 is the engine minimum; the real figure is the longest lookback in use.

[params.universe]
type = "symbols"
default = "nifty200_alpha30"
description = "Engine-known universe name (honba.markets.india.universes) or a list of 'SYMBOL' / 'SYMBOL:EXCHANGE'."
sweepable = false

[params.point_in_time]
type = "bool"
optional = true
description = "Use historical membership snapshots (named universes only); needs the engine's universe history, else the engine raises. Omitted means false."
sweepable = false

[params.weighting]
type = "str"
default = "equal"
pattern = "^(equal|inverse_vol(:([2-9]|[1-9][0-9]+))?)$"
description = "Weights: 'equal', 'inverse_vol' or 'inverse_vol:<lookback>'."
sweepable = false

[params.schedule]
type = "str"
default = "every:15d"
pattern = "^(every:[1-9][0-9]*d|monthly:first_session|drift:([0-9]+[.]?[0-9]*|[.][0-9]+))(\\+(every:[1-9][0-9]*d|monthly:first_session|drift:([0-9]+[.]?[0-9]*|[.][0-9]+)))*$"
description = "Rebalance trigger: 'every:<N>d', 'monthly:first_session' or 'drift:<tolerance>'; join with '+' for any-of."
sweepable = true

[params.select]
type = "str"
optional = true
pattern = "^top:[1-9][0-9]*:(momentum|low_vol|mean_reversion):([2-9]|[1-9][0-9]+)$"
description = "Selection: 'top:<n>:<momentum|low_vol|mean_reversion>:<lookback>'. Omitted keeps every universe member."
sweepable = false

[params.allocation]
type = "float"
default = 0.995
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of portfolio value to deploy; must be in (0, 1]."
sweepable = false

[params.history_len]
type = "int"
optional = true
min = 1
max = 2000
step = 1
description = "Closes kept per instrument; omitted means max(64, longest lookback in use). Must be >= the longest lookback."
sweepable = false

[requires]
bars = ["close"]
fundamentals = []
indicators = []
history_bars = 64
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]
