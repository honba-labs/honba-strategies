schema = 1
id = "signal.vwap_reversion"
kind = "signal"
title = "VWAP reversion"
description = "Intraday long-only: buy below the lower VWAP band before the entry cutoff; exit at VWAP or at square-off (IST)."
tags = ["mean_reversion", "intraday", "volume", "long_only"]

# band_mult lives under [indicators.vwap] in config.toml, not [params]. VWAP resets each IST session, so
# history_bars is 1.

[params.entry_cutoff]
type = "str"
default = "14:30"
pattern = "^([01]\\d|2[0-3]):[0-5]\\d$"
description = "No new entries at or after this IST time (HH:MM); must be before squareoff."
sweepable = false

[params.squareoff]
type = "str"
default = "15:15"
pattern = "^([01]\\d|2[0-3]):[0-5]\\d$"
description = "Flatten at or after this IST time (HH:MM), before the broker's ~15:20 MIS auto square-off."
sweepable = false

[params.band_mult]
type = "float"
default = 2.0
min = 0.5
max = 4.0
step = 0.1
description = "VWAP band half-width in standard deviations. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.capital]
type = "float"
default = 1000000
min = 1000
max = 10000000000
description = "INR available to the strategy."
sweepable = false

[params.allocation]
type = "float"
default = 0.95
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed per entry; the strategy requires 0 < allocation <= 1."
sweepable = false

[requires]
bars = ["high", "low", "close", "volume", "ts"]
fundamentals = []
indicators = [
  { kind = "vwap", band_mult = "$band_mult", as = "vwap" },
]
history_bars = 1
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]
