name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: honba-strategies
      # The catalog tests import `honba`, which is not published to PyPI: build the
      # core (Rust extension via maturin) from its GitHub repo.
      - uses: actions/checkout@v4
        with:
          repository: honba-labs/honba
          path: honba
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: honba
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: create virtualenv (maturin develop requires one)
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: build and install honba
        working-directory: honba/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt maturin pytest ruff
          maturin develop
      - name: lint
        working-directory: honba-strategies
        run: |
          ruff check .
          ruff format --check .
      - name: pytest (registry, fills, per-strategy tests)
        working-directory: honba-strategies
        run: pytest -q
