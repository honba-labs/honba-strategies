schema = 1
id = "signal.kdj_cross"
kind = "signal"
title = "KDJ cross"
description = "Long-only: buy when J is above K and D; exit on J turning down in profit, J below K or D, or an ATR stop."
tags = ["momentum", "oscillator", "long_only", "stop_loss"]

[params.fastk]
type = "int"
default = 9
min = 2
max = 100
step = 1
description = "Stochastic lookback (bars). Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.slowk]
type = "int"
default = 3
min = 1
max = 20
step = 1
description = "K smoothing. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.slowd]
type = "int"
default = 3
min = 1
max = 20
step = 1
description = "D smoothing. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.atr_period]
type = "int"
default = 14
min = 2
max = 100
step = 1
description = "ATR period for the protective stop. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.atr_mult]
type = "float"
default = 2.0
min = 0.5
max = 10.0
step = 0.25
description = "Stop distance in ATRs below entry. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.atr_first_bar]
type = "bool"
default = false
description = "True: the first true range is high-low (Jesse's convention)."
sweepable = false

[params.slowk_ma]
type = "enum"
default = "sma"
choices = ["sma", "ema", "rma", "wma"]
description = "KDJ K smoothing moving average."
sweepable = false

[params.slowd_ma]
type = "enum"
default = "sma"
choices = ["sma", "ema", "rma", "wma"]
description = "KDJ D smoothing moving average."
sweepable = false

[params.capital]
type = "float"
default = 1000000
min = 1000
max = 10000000000
description = "INR available to the strategy."
sweepable = false

[params.allocation]
type = "float"
default = 0.95
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed per entry; the strategy requires 0 < allocation <= 1."
sweepable = false

[requires]
bars = ["high", "low", "close"]
fundamentals = []
indicators = [
  { kind = "kdj", fastk = "$fastk", slowk = "$slowk", slowd = "$slowd", slowk_ma = "$slowk_ma", slowd_ma = "$slowd_ma", as = "kdj" },
  { kind = "atr", period = "$atr_period", include_first_bar = "$atr_first_bar", as = "stop_atr" },
]
history_bars = "$fastk"
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]
