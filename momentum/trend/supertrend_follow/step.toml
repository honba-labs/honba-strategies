schema = 1
id = "signal.supertrend_follow"
kind = "signal"
title = "Supertrend follow"
description = "Long-only: buy while Supertrend is in an uptrend, exit when it flips to a downtrend."
tags = ["trend", "volatility", "long_only"]

# atr_period and factor live under [indicators.trend] in config.toml, not [params].

[params.atr_period]
type = "int"
default = 10
min = 2
max = 100
step = 1
description = "Supertrend ATR length. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.factor]
type = "float"
default = 3.0
min = 0.5
max = 10.0
step = 0.5
description = "Band width in ATRs. Bounds are a catalog choice; the strategy does not enforce them."
sweepable = true

[params.capital]
type = "float"
default = 1000000
min = 1000
max = 10000000000
description = "INR available to the strategy."
sweepable = false

[params.allocation]
type = "float"
default = 0.95
min = 0.01
max = 1.0
step = 0.01
description = "Fraction of capital deployed per entry; the strategy requires 0 < allocation <= 1."
sweepable = false

[requires]
bars = ["high", "low", "close"]
fundamentals = []
indicators = [
  { kind = "supertrend", atr_period = "$atr_period", factor = "$factor", as = "trend" },
]
history_bars = "$atr_period"
pit = false

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = ["side", "quantity"]
report = []
reportable = []

[chain]
after = ["universe"]
before = ["risk", "execute"]
