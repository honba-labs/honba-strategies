name = "kdj_cross"
symbol = "NIFTY50"
venue = "NSE"

[params]
fastk = 9        # stochastic lookback (bars)
slowk = 3        # K smoothing
slowd = 3        # D smoothing
atr_period = 14  # ATR period for the protective stop
